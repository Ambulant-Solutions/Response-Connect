{% macro button(label, url) %}
<table
    role="presentation"
    cellspacing="0"
    cellpadding="0"
    border="0"
    style="
        margin: 28px 0;
        border-collapse: collapse;
    "
>
    <tr>
        <td
            bgcolor="#0EA5A0"
            style="
                border-radius: 6px;
                background-color: #0ea5a0;
            "
        >
            <a
                href="{{ url }}"
                style="
                    display: inline-block;
                    padding: 13px 22px;
                    color: #ffffff;
                    font-size: 15px;
                    font-weight: 700;
                    line-height: 1.2;
                    text-decoration: none;
                    border-radius: 6px;
                "
            >
                {{ label }}
            </a>
        </td>
    </tr>
</table>
{% endmacro %}
