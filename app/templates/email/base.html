<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">

    <title>{% block title %}{{ email_brand_name }}{% endblock %}</title>
</head>

<body
    style="
        margin: 0;
        padding: 0;
        background-color: #f4f6f8;
        color: #334155;
        font-family: Arial, Helvetica, sans-serif;
        -webkit-text-size-adjust: 100%;
    "
>
    <div
        style="
            display: none;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            color: transparent;
        "
    >
        {% block preheader %}{% endblock %}
    </div>

    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="
            width: 100%;
            background-color: #f4f6f8;
            border-collapse: collapse;
        "
    >
        <tr>
            <td
                align="center"
                style="padding: 32px 16px;"
            >
                <table
                    role="presentation"
                    width="600"
                    cellspacing="0"
                    cellpadding="0"
                    border="0"
                    style="
                        width: 100%;
                        max-width: 600px;
                        border-collapse: collapse;
                    "
                >
                    <tr>
                        <td
                            style="
                                padding: 22px 28px;
                                background-color: #0b1d3a;
                                border-radius: 10px 10px 0 0;
                            "
                        >
                            <table
                                role="presentation"
                                width="100%"
                                cellspacing="0"
                                cellpadding="0"
                                border="0"
                                style="border-collapse: collapse;"
                            >
                                <tr>
                                    <td>
                                        <div
                                            style="
                                                color: #ffffff;
                                                font-size: 22px;
                                                font-weight: 700;
                                                line-height: 1.3;
                                            "
                                        >
                                            {{ email_brand_name }}
                                        </div>

                                        {% block header_subtitle %}{% endblock %}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td
                            style="
                                padding: 36px 32px;
                                background-color: #ffffff;
                                border: 1px solid #e2e8f0;
                                border-top: 0;
                            "
                        >
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <tr>
                        <td
                            style="
                                padding: 22px 28px;
                                background-color: #e6f2f7;
                                border-radius: 0 0 10px 10px;
                                color: #64748b;
                                font-size: 12px;
                                line-height: 1.6;
                                text-align: center;
                            "
                        >
                            {% block footer %}
                                <p style="margin: 0 0 6px;">
                                    This email was sent by {{ email_brand_name }}.
                                </p>

                                {% if email_support_email %}
                                    <p style="margin: 0;">
                                        Need help?
                                        <a
                                            href="mailto:{{ email_support_email }}"
                                            style="
                                                color: #0b1d3a;
                                                text-decoration: underline;
                                            "
                                        >
                                            {{ email_support_email }}
                                        </a>
                                    </p>
                                {% endif %}
                            {% endblock %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
